<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 715" width="1440" height="715" preserveAspectRatio="xMidYMid slice" role="presentation" data-hero-art="">
  <defs>
    <linearGradient id="heroSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#120d2e"/>
      <stop offset="0.14" stop-color="#0b0620"/>
      <stop offset="0.34" stop-color="#070126"/>
      <stop offset="0.62" stop-color="#04001a"/>
      <stop offset="1" stop-color="#000102"/>
    </linearGradient>

    <linearGradient id="heroHalo" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3a2a8a" stop-opacity="0"/><stop offset="0.26" stop-color="#3a2a8a" stop-opacity="0.12"/><stop offset="0.36" stop-color="#7b5ce0" stop-opacity="0.8"/><stop offset="0.41" stop-color="#c9a6ff" stop-opacity="1"/><stop offset="0.61" stop-color="#c9a6ff" stop-opacity="1"/><stop offset="0.66" stop-color="#7b5ce0" stop-opacity="0.8"/><stop offset="0.76" stop-color="#3a2a8a" stop-opacity="0.12"/><stop offset="1" stop-color="#3a2a8a" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="heroCore" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4a5fd8" stop-opacity="0"/><stop offset="0.26" stop-color="#4a5fd8" stop-opacity="0.12"/><stop offset="0.36" stop-color="#dcb6ff" stop-opacity="0.8"/><stop offset="0.41" stop-color="#ffffff" stop-opacity="1"/><stop offset="0.61" stop-color="#ffffff" stop-opacity="1"/><stop offset="0.66" stop-color="#dcb6ff" stop-opacity="0.8"/><stop offset="0.76" stop-color="#4a5fd8" stop-opacity="0.12"/><stop offset="1" stop-color="#4a5fd8" stop-opacity="0"/>
    </linearGradient>

    <!-- The hot spot: pure white, and gone by the time the arc curves away, so the
         blow-out is confined to the apex. -->
    <linearGradient id="heroHot" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/><stop offset="0.42" stop-color="#ffffff" stop-opacity="0.55"/><stop offset="0.5" stop-color="#ffffff" stop-opacity="1"/><stop offset="0.58" stop-color="#ffffff" stop-opacity="0.55"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- The planet's own shading. A flat fill reads as a cut-out disc; the source
         shades the body, so the visible cap is lit near its edge and fades inward. -->
    <radialGradient id="heroPlanetShade" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#010104"/><stop offset="0.45" stop-color="#030016"/><stop offset="0.72" stop-color="#060124"/><stop offset="0.86" stop-color="#090232"/><stop offset="0.94" stop-color="#0d0929"/><stop offset="1" stop-color="#171241"/>
    </radialGradient>

    <radialGradient id="heroCursor" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="0.22" stop-color="#e4c6ff" stop-opacity="0.6"/>
      <stop offset="0.45" stop-color="#a86dff" stop-opacity="0.35"/>
      <stop offset="0.7" stop-color="#4714d9" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#4714d9" stop-opacity="0"/>
    </radialGradient>

    <filter id="heroHaloBlur" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="32"/>
    </filter>
    <filter id="heroCoreBlur" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <filter id="heroInnerBlur" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>

    <!-- Clips the inner bleed to the planet, so it only lights the surface. -->
    <clipPath id="heroPlanetClip">
      <circle cx="719.5" cy="870.5" r="671.5"/>
    </clipPath>
  </defs>

  <rect width="1440" height="715" fill="url(#heroSky)"/>

  <!-- Atmosphere: the limb stroked wide, so the light bleeds off the horizon. -->
  <circle cx="719.5" cy="870.5" r="731.5" fill="none"
          stroke="url(#heroHalo)" stroke-width="120" filter="url(#heroHaloBlur)"/>

  <!-- The bright crest: a slightly larger circle, so the peak light sits above the
       horizon where the source has it, not on the limb. -->
  <circle cx="719.5" cy="870.5" r="749.5" fill="none"
          stroke="url(#heroCore)" stroke-width="22" filter="url(#heroCoreBlur)"/>

  <!-- The hot spot at the apex. -->
  <circle cx="719.5" cy="870.5" r="749.5" fill="none"
          stroke="url(#heroHot)" stroke-width="16" filter="url(#heroCoreBlur)"/>

  <!-- The planet itself, over the inner half of the strokes above. -->
  <circle cx="719.5" cy="870.5" r="671.5" fill="url(#heroPlanetShade)"/>

  <!-- Inner bleed, clipped to the planet so it lights the surface just under the
       horizon. Drawn after the planet, or the planet covers it. -->
  <g clip-path="url(#heroPlanetClip)">
    <circle cx="719.5" cy="870.5" r="671.5" fill="none"
            stroke="url(#heroHalo)" stroke-width="60" filter="url(#heroInnerBlur)"
            opacity="0.15"/>
  </g>

  <!-- Interactive layer, positioned by the custom properties written on the hero
       element by the pointer handler; opacity 0 until a pointer is over the hero. -->
  <ellipse data-cursor-glow="" cx="50%" cy="50%" rx="44%" ry="70%" fill="url(#heroCursor)" opacity="0"/>
</svg>
